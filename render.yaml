databases:
  - name: bags-stock-db
    plan: free
    databaseName: bags_stock
    user: bags_user

services:
  - type: web
    name: bags-stock-erp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: bags-stock-db
          property: connectionString

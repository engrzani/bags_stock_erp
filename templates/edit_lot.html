{% extends 'base.html' %}
{% block title %}Edit Lot {{ lot.lot_number }} — Bags Stock ERP{% endblock %}
{% block breadcrumb %}
<a href="{{ url_for('lots') }}" class="breadcrumb-link">Lots</a>
<i class="bi bi-chevron-right mx-1"></i>
<a href="{{ url_for('lot_detail', lot_id=lot.id) }}" class="breadcrumb-link">{{ lot.lot_number }}</a>
<i class="bi bi-chevron-right mx-1"></i>
<span class="breadcrumb-current">Edit</span>
{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Edit Lot: {{ lot.lot_number }}</h1>
    <p class="page-subtitle">Update lot information</p>
  </div>
  <a href="{{ url_for('lot_detail', lot_id=lot.id) }}" class="btn btn-outline-secondary btn-action">
    <i class="bi bi-arrow-left me-2"></i>Back to Lot
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card-custom">
      <div class="card-custom-header">
        <h5 class="card-custom-title">
          <i class="bi bi-pencil-square me-2 text-primary"></i>Lot Information
        </h5>
      </div>
      <div class="card-custom-body">
        <form method="POST" action="{{ url_for('edit_lot', lot_id=lot.id) }}">
          <div class="form-group-custom">
            <label class="form-label-custom">Lot Number <span class="text-danger">*</span></label>
            <input type="text" name="lot_number" class="form-control form-control-custom"
                   value="{{ lot.lot_number }}" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Supplier / Source</label>
            <input type="text" name="supplier" class="form-control form-control-custom"
                   value="{{ lot.supplier or '' }}" placeholder="e.g. Ali Traders, Local Market...">
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Date Received <span class="text-danger">*</span></label>
            <input type="date" name="date_received" class="form-control form-control-custom"
                   value="{{ lot.date_received.strftime('%Y-%m-%d') }}" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Notes</label>
            <textarea name="notes" class="form-control form-control-custom" rows="3"
                      placeholder="Any additional notes...">{{ lot.notes or '' }}</textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg px-5">
              <i class="bi bi-check-circle me-2"></i>Save Changes
            </button>
            <a href="{{ url_for('lot_detail', lot_id=lot.id) }}" class="btn btn-light btn-lg px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

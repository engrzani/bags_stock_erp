{% extends 'base.html' %}
{% block title %}Add Client — Bags Stock ERP{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('clients') }}" class="breadcrumb-link">Clients</a> / Add Client{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Add New Client</h1>
    <p class="page-subtitle">Register a new customer for dispatch tracking</p>
  </div>
  <a href="{{ url_for('clients') }}" class="btn btn-outline-secondary btn-action">
    <i class="bi bi-arrow-left me-2"></i>Back
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card-custom">
      <div class="card-custom-header">
        <h5 class="card-custom-title"><i class="bi bi-building me-2 text-primary"></i>Client Details</h5>
      </div>
      <div class="card-custom-body">
        <form method="POST" action="{{ url_for('add_client') }}">
          <div class="row g-3">
            <div class="col-12">
              <div class="form-group-custom">
                <label class="form-label-custom">Client / Company Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control-custom form-control" required placeholder="e.g. Ali Traders">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group-custom">
                <label class="form-label-custom">Contact Person</label>
                <input type="text" name="contact_person" class="form-control-custom form-control" placeholder="e.g. Muhammad Ali">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group-custom">
                <label class="form-label-custom">Phone Number</label>
                <input type="text" name="phone" class="form-control-custom form-control" placeholder="e.g. 0300-1234567">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group-custom">
                <label class="form-label-custom">City</label>
                <input type="text" name="city" class="form-control-custom form-control" placeholder="e.g. Lahore">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group-custom">
                <label class="form-label-custom">Address</label>
                <input type="text" name="address" class="form-control-custom form-control" placeholder="Street address">
              </div>
            </div>
            <div class="col-12">
              <div class="form-group-custom">
                <label class="form-label-custom">Notes</label>
                <textarea name="notes" class="form-control-custom form-control" rows="2" placeholder="Any additional notes..."></textarea>
              </div>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-action">
              <i class="bi bi-building me-2"></i>Save Client
            </button>
            <a href="{{ url_for('clients') }}" class="btn btn-light btn-action">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

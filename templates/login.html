<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Bags Stock ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #4361ee, #3a0ca3);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(67,97,238,0.4);
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.3);
    }
    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }
    .form-label {
      font-weight: 600;
      font-size: 13px;
      color: #374151;
      margin-bottom: 6px;
    }
    .input-group-text {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-right: none;
      color: #64748b;
    }
    .form-control {
      border: 1.5px solid #e2e8f0;
      border-left: none;
      font-size: 14px;
      padding: 10px 14px;
      color: #1e293b;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #4361ee;
      box-shadow: 0 0 0 3px rgba(67,97,238,0.1);
      outline: none;
    }
    .form-control:focus + * { border-color: #4361ee; }
    .input-group:focus-within .input-group-text {
      border-color: #4361ee;
    }
    .btn-login {
      background: linear-gradient(135deg, #4361ee, #3a0ca3);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      width: 100%;
      margin-top: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(67,97,238,0.3);
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(67,97,238,0.4);
    }
    .btn-login:active { transform: translateY(0); }
    .alert-danger {
      border-radius: 10px;
      border: none;
      background: #fef2f2;
      color: #dc2626;
      font-size: 13.5px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
    .show-pass-btn {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-left: none;
      color: #64748b;
      cursor: pointer;
      padding: 0 12px;
      transition: color 0.2s;
    }
    .show-pass-btn:hover { color: #4361ee; }
    .mb-field { margin-bottom: 18px; }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-brand">
    <div class="brand-logo"><i class="bi bi-bag-fill"></i></div>
    <div class="brand-title">Bags ERP</div>
    <div class="brand-sub">Stock Management System</div>
  </div>

  <div class="login-card">
    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in to your admin account</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-field">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-field">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Enter password" required autocomplete="current-password">
          <button type="button" class="show-pass-btn" onclick="togglePass()">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="login-footer">
      Bags Stock ERP &copy; 2026 &nbsp;|&nbsp; v1.0
    </div>
  </div>
</div>

<script>
function togglePass() {
  const inp = document.getElementById('passwordInput');
  const icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
</script>
</body>
</html>

{% extends 'base.html' %}
{% block title %}Add Lot — Bags Stock ERP{% endblock %}
{% block breadcrumb %}
<a href="{{ url_for('lots') }}" class="breadcrumb-link">Lots</a>
<i class="bi bi-chevron-right mx-1"></i>
<span class="breadcrumb-current">Add New Lot</span>
{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Add New Lot</h1>
    <p class="page-subtitle">Register a new incoming stock lot</p>
  </div>
  <a href="{{ url_for('lots') }}" class="btn btn-outline-secondary btn-action">
    <i class="bi bi-arrow-left me-2"></i>Back to Lots
  </a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card-custom">
      <div class="card-custom-header">
        <h5 class="card-custom-title">
          <i class="bi bi-plus-circle me-2 text-primary"></i>Lot Information
        </h5>
      </div>
      <div class="card-custom-body">
        <form method="POST" action="{{ url_for('add_lot') }}">
          <div class="form-group-custom">
            <label class="form-label-custom">Lot Number <span class="text-danger">*</span></label>
            <input type="text" name="lot_number" class="form-control form-control-custom"
                   placeholder="e.g. LOT-2026-001" required>
            <small class="form-hint">Unique identifier for this lot</small>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Supplier / Source</label>
            <input type="text" name="supplier" class="form-control form-control-custom"
                   placeholder="e.g. Ali Traders, Local Market...">
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Date Received <span class="text-danger">*</span></label>
            <input type="date" name="date_received" class="form-control form-control-custom"
                   value="{{ today }}" required>
          </div>

          <div class="form-group-custom">
            <label class="form-label-custom">Notes</label>
            <textarea name="notes" class="form-control form-control-custom" rows="3"
                      placeholder="Any additional notes about this lot..."></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg px-5">
              <i class="bi bi-check-circle me-2"></i>Save Lot
            </button>
            <a href="{{ url_for('lots') }}" class="btn btn-light btn-lg px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
